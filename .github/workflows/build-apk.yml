name: Extract zip and build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract zip and build debug APK
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          ZIP=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP"
          rm -rf extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/tradeexpert-debug.apk"

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tradeexpert-debug-apk
          path: out/tradeexpert-debug.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TradeExpert build ${{ github.run_number }}
          files: out/tradeexpert-debug.apk
          
